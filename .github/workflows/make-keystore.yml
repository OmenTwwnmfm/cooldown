name: make-keystore

# 一次性用：在云端生成 app/cooldown.jks（本机没装 JDK 时用这个）
#
# 用法：
#   1. Actions → 左侧 make-keystore → Run workflow
#   2. 跑完在页面下方下载 cooldown-keystore.zip，解压出 cooldown.jks
#   3. 放到项目的 app\cooldown.jks，然后 git add / commit / push
#   4. 删掉这个文件（.github/workflows/make-keystore.yml），避免以后误跑换掉密钥
#
# ⚠️ 密钥一旦换了，手机上已装的 App 就再也无法覆盖升级，只能卸载重装。
#    所以这个文件里有「已存在就拒绝生成」的保护。

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 已经存在就拒绝生成
        run: |
          if [ -f app/cooldown.jks ]; then
            echo "app/cooldown.jks 已存在，不能重新生成 —— 换密钥会导致所有已安装的 App 无法覆盖升级"
            exit 1
          fi
          echo "仓库里还没有 cooldown.jks，可以生成"

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 生成密钥库
        run: |
          keytool -genkeypair -v -keystore cooldown.jks -storetype JKS -alias cooldown -keyalg RSA -keysize 2048 -sigalg SHA256withRSA -validity 36500 -storepass "cooldown123" -keypass "cooldown123" -dname "CN=Cooldown, OU=Self, O=Self, L=NA, ST=NA, C=CN"
          keytool -list -v -keystore cooldown.jks -storepass "cooldown123" | head -20

      - name: 上传密钥库
        uses: actions/upload-artifact@v4
        with:
          name: cooldown-keystore
          path: cooldown.jks
          if-no-files-found: error
