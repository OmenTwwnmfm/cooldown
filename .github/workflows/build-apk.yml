name: build-apk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi

      - name: 装依赖
        working-directory: app
        run: npm install

      - name: 放进 www
        run: |
          VER="v$(date -u +%Y%m%d%H%M)"
          echo "APP_VER=$VER" >> "$GITHUB_ENV"
          echo "APP_CODE=$(date -u +%s)" >> "$GITHUB_ENV"
          echo "本次版本号：$VER"
          mkdir -p app/www
          sed "s/__APP_VERSION__/$VER/g" spend-guard.html > app/www/index.html
          cp manifest.json app/www/manifest.json
          cp sw.js app/www/sw.js
          cp icon-1024.png app/www/icon-1024.png

      - name: 生成 android 工程并同步
        working-directory: app
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: 固定签名
        working-directory: app
        run: |
          if [ ! -f cooldown.jks ]; then
            echo "没有 app/cooldown.jks —— 这次仍用默认调试签名（每次构建都不同，覆盖安装会失败）"
            exit 0
          fi
          cat >> android/app/build.gradle <<'SIGN'
          android {
            signingConfigs {
              debug {
                storeFile file("../../cooldown.jks")
                storePassword "cooldown123"
                keyAlias "cooldown"
                keyPassword "cooldown123"
              }
            }
          }
          SIGN
          echo "已追加固定签名配置"

      - name: 写入版本号
        working-directory: app
        run: |
          cat >> android/app/build.gradle <<GRADLE

          android {
            defaultConfig {
              versionName "${APP_VER}"
              versionCode ${APP_CODE}
            }
          }
          GRADLE
          echo "已写入版本号 ${APP_VER}（versionCode ${APP_CODE}）"

      - name: 修补安全区（原生 insets）
        working-directory: app
        run: |
          F=android/app/src/main/java/com/cooldown/app/MainActivity.java
          mkdir -p "$(dirname "$F")"
          cat > "$F" <<'JAVA'
          package com.cooldown.app;

          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              View content = findViewById(android.R.id.content);
              if (content == null) return;
              boolean dark = (getResources().getConfiguration().uiMode
                  & Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES;
              content.setBackgroundColor(Color.parseColor(dark ? "#1A1917" : "#F5F4EE"));
              WindowInsetsControllerCompat wic = WindowCompat.getInsetsController(getWindow(), content);
              if (wic != null) {
                wic.setAppearanceLightStatusBars(!dark);
                wic.setAppearanceLightNavigationBars(!dark);
              }
              ViewCompat.setOnApplyWindowInsetsListener(content, (v, insets) -> {
                Insets b = insets.getInsets(WindowInsetsCompat.Type.systemBars());
                v.setPadding(b.left, b.top, b.right, b.bottom);
                return insets;
              });
            }
          }
          JAVA
          echo "已写入 MainActivity（原生安全区）"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app/android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: 编译 Debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 重命名 APK
        run: |
          D=app/android/app/build/outputs/apk/debug
          mv "$D/app-debug.apk" "$D/cooldown_${APP_VER}.apk"
          ls -l "$D"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: cooldown_${{ env.APP_VER }}
          path: app/android/app/build/outputs/apk/debug/cooldown_*.apk
          if-no-files-found: error
