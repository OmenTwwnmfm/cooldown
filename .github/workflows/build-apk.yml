name: build-apk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: 装依赖
        working-directory: app
        run: npm install

      - name: 放进 www
        run: |
          mkdir -p app/www
          cp spend-guard.html app/www/index.html
          cp manifest.json app/www/manifest.json
          cp sw.js app/www/sw.js
          cp icon-1024.png app/www/icon-1024.png

      - name: 生成 android 工程并同步
        working-directory: app
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app/android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: 编译 Debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: cooldown-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
